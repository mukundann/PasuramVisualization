<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pasuram Asset Studio - Mobile Uploader</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --primary: #238636;
      --gold: #d4af37;
      --text: #c9d1d9;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }
    .card {
      background: var(--card);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .form-group { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 6px;
      color: #8b949e;
      text-transform: uppercase;
      font-weight: 600;
    }
    input, button {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0d1117;
      color: #fff;
      box-sizing: border-box;
      font-size: 1rem;
    }
    button {
      background: var(--primary);
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 8px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 12px; font-size: 0.9rem; word-break: break-all; }
  </style>
</head>
<body>

  <h2 style="color: var(--gold); text-align: center; margin-top: 0;">Pasuram Asset Uploader</h2>

  <!-- Auth Card -->
  <div class="card" id="authCard">
    <button onclick="loginWithGitHub()" style="background: #24292e; border: 1px solid var(--border);">
      Sign In with GitHub
    </button>
  </div>

  <!-- Upload Form Card -->
  <div class="card" id="uploadCard" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
      <span style="font-size: 0.85rem; color: #3fb950; font-weight: bold;">✓ Authenticated</span>
      <button onclick="logout()" style="width: auto; padding: 6px 12px; font-size: 0.8rem; background: #da3633; margin: 0;">Logout</button>
    </div>

    <form id="uploadForm">
      <div class="form-group">
        <label for="title">Asset Title</label>
        <input type="text" id="title" placeholder="e.g. Srirangam Rajagopuram" required>
      </div>

      <div class="form-group">
        <label for="pasuramKey">Pasuram ID / Key</label>
        <input type="text" id="pasuramKey" placeholder="e.g. PTM_5.8_1">
      </div>

      <div class="form-group">
        <label for="tags">Tags (comma separated)</label>
        <input type="text" id="tags" placeholder="e.g. gopuram, srirangam, kaveri" required>
      </div>

      <div class="form-group">
        <label for="fileInput">Select Image</label>
        <input type="file" id="fileInput" accept="image/*" required>
      </div>

      <button type="submit" id="submitBtn">Upload & Process Asset</button>
    </form>
    <div id="status" class="status"></div>
  </div>

  <script>
    let CLIENT_ID = '';
    let REPO_OWNER = '';
    let REPO_NAME = '';
    let accessToken = localStorage.getItem('gh_oauth_token');

    // 1. Fetch Configuration First
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('config.json');
        if (!res.ok) throw new Error('Could not load config.json');
        const config = await res.json();
        
        CLIENT_ID = config.clientId;
        REPO_OWNER = config.repoOwner;
        REPO_NAME = config.repoName;

        handleOAuthCallback();
      } catch (err) {
        document.getElementById('status').innerText = 'Error loading config.json file.';
      }
    });

    function handleOAuthCallback() {
      if (accessToken) {
        showUploadForm();
      } else {
        showAuthButton();
      }
    }

    function loginWithGitHub() {
      if (!CLIENT_ID) {
        alert('Client ID not found in config.json');
        return;
      }
      const redirectUri = window.location.href.split('?')[0];
      window.location.href = `https://github.com/login/oauth/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(redirectUri)}&scope=public_repo`;
    }

    function logout() {
      localStorage.removeItem('gh_oauth_token');
      accessToken = null;
      showAuthButton();
    }

    function showUploadForm() {
      document.getElementById('authCard').style.display = 'none';
      document.getElementById('uploadCard').style.display = 'block';
    }

    function showAuthButton() {
      document.getElementById('authCard').style.display = 'block';
      document.getElementById('uploadCard').style.display = 'none';
    }

    // 2. Submit Image to incoming/ Directory
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const statusDiv = document.getElementById('status');
      btn.disabled = true;
      statusDiv.style.color = '#c9d1d9';
      statusDiv.innerHTML = 'Uploading image to incoming queue...';

      const file = document.getElementById('fileInput').files[0];
      const title = document.getElementById('title').value.trim();
      const pasuramKey = document.getElementById('pasuramKey').value.trim();
      const tags = document.getElementById('tags').value.trim();

      const reader = new FileReader();
      reader.onload = async () => {
        const base64Content = reader.result.split(',')[1];
        const cleanFileName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
        const filePath = `incoming/${Date.now()}_${cleanFileName}`;

        const commitMessage = JSON.stringify({
          type: "ASSET_UPLOAD",
          title: title,
          pasuramKey: pasuramKey,
          tags: tags.split(',').map(t => t.trim().toLowerCase()).filter(t => t)
        });

        try {
          const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filePath}`, {
            method: 'PUT',
            headers: {
              'Authorization': `token ${accessToken}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              message: commitMessage,
              content: base64Content
            })
          });

          if (!res.ok) {
            const errData = await res.json();
            throw new Error(errData.message || 'Upload failed');
          }

          statusDiv.style.color = '#3fb950';
          statusDiv.innerHTML = 'Uploaded to incoming/! The GitHub Action is now processing the image and updating asset_database.json.';
          document.getElementById('uploadForm').reset();
        } catch (err) {
          statusDiv.style.color = '#f85149';
          statusDiv.innerHTML = `Error: ${err.message}`;
        } finally {
          btn.disabled = false;
        }
      };

      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
