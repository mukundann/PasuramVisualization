<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pasuram Asset Studio - Mobile Uploader</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --primary: #238636;
      --gold: #d4af37;
      --text: #c9d1d9;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }
    .card {
      background: var(--card);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .form-group { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 6px;
      color: #8b949e;
      text-transform: uppercase;
      font-weight: 600;
    }
    input, button {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0d1117;
      color: #fff;
      box-sizing: border-box;
      font-size: 1rem;
    }
    button {
      background: var(--primary);
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 8px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .user-code {
      font-size: 1.8rem;
      font-weight: bold;
      letter-spacing: 4px;
      color: var(--gold);
      text-align: center;
      margin: 12px 0;
      user-select: all;
    }
    .status { margin-top: 12px; font-size: 0.9rem; word-break: break-all; }
  </style>
</head>
<body>

  <h2 style="color: var(--gold); text-align: center; margin-top: 0;">Pasuram Asset Uploader</h2>

  <!-- Auth Card -->
  <div class="card" id="authCard">
    <button onclick="startDeviceFlow()">Sign In with GitHub</button>
    <div id="devicePrompt" style="display: none; margin-top: 16px; text-align: center;">
      <p style="margin: 0; font-size: 0.9rem;">Copy this code:</p>
      <div id="userCode" class="user-code">----</div>
      <p style="font-size: 0.85rem; color: #8b949e;">Then open the link below and paste the code:</p>
      <a id="verifyLink" href="#" target="_blank" style="color: #58a6ff; font-weight: bold;">github.com/login/device</a>
      <p style="font-size: 0.8rem; color: #8b949e; margin-top: 12px;">Waiting for authorization...</p>
    </div>
  </div>

  <!-- Upload Form Card -->
  <div class="card" id="uploadCard" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
      <span style="font-size: 0.85rem; color: #3fb950; font-weight: bold;">✓ Signed In</span>
      <button onclick="logout()" style="width: auto; padding: 6px 12px; font-size: 0.8rem; background: #da3633; margin: 0;">Logout</button>
    </div>

    <form id="uploadForm">
      <div class="form-group">
        <label for="title">Asset Title</label>
        <input type="text" id="title" placeholder="e.g. Srirangam Rajagopuram" required>
      </div>

      <div class="form-group">
        <label for="pasuramKey">Pasuram ID / Key</label>
        <input type="text" id="pasuramKey" placeholder="e.g. PTM_5.8_1">
      </div>

      <div class="form-group">
        <label for="tags">Tags (comma separated)</label>
        <input type="text" id="tags" placeholder="e.g. gopuram, srirangam, kaveri" required>
      </div>

      <div class="form-group">
        <label for="fileInput">Select Image</label>
        <input type="file" id="fileInput" accept="image/*" required>
      </div>

      <button type="submit" id="submitBtn">Upload & Process Asset</button>
    </form>
    <div id="status" class="status"></div>
  </div>

  <script>
    // --- CONFIGURATION ---
    const CLIENT_ID = 'YOUR_GITHUB_OAUTH_CLIENT_ID'; // <--- Paste Client ID here
    const REPO_OWNER = 'mukundann';
    const REPO_NAME = 'PasuramVisualization';

    let accessToken = localStorage.getItem('gh_device_token');

    window.addEventListener('DOMContentLoaded', updateUI);

    function updateUI() {
      if (accessToken) {
        document.getElementById('authCard').style.display = 'none';
        document.getElementById('uploadCard').style.display = 'block';
      } else {
        document.getElementById('authCard').style.display = 'block';
        document.getElementById('uploadCard').style.display = 'none';
      }
    }

    // Step 1: Initiate Device Code Flow
    async function startDeviceFlow() {
      try {
        const res = await fetch('https://github.com/login/device/code', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            client_id: CLIENT_ID,
            scope: 'public_repo'
          })
        });

        const data = await res.json();
        if (data.user_code) {
          document.getElementById('userCode').innerText = data.user_code;
          document.getElementById('verifyLink').href = data.verification_uri;
          document.getElementById('devicePrompt').style.display = 'block';

          // Poll GitHub until collaborator approves
          pollForToken(data.device_code, data.interval || 5);
        } else {
          alert('Error starting device auth: ' + (data.error_description || 'Check Client ID'));
        }
      } catch (err) {
        alert('Network error: ' + err.message);
      }
    }

    // Step 2: Poll for completion
    async function pollForToken(deviceCode, interval) {
      const pollInterval = setInterval(async () => {
        try {
          const res = await fetch('https://github.com/login/oauth/access_token', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({
              client_id: Ov23li1HfEGHbDtJK1eQ,
              device_code: deviceCode,
              grant_type: 'urn:ietf:params:oauth:grant-type:device_code'
            })
          });

          const data = await res.json();
          if (data.access_token) {
            clearInterval(pollInterval);
            accessToken = data.access_token;
            localStorage.setItem('gh_device_token', accessToken);
            updateUI();
          } else if (data.error !== 'authorization_pending') {
            clearInterval(pollInterval);
            alert('Authorization failed: ' + data.error);
          }
        } catch (e) {
          // ignore transient errors while polling
        }
      }, interval * 1000);
    }

    function logout() {
      localStorage.removeItem('gh_device_token');
      accessToken = null;
      document.getElementById('devicePrompt').style.display = 'none';
      updateUI();
    }

    // Step 3: Push Image to incoming/ to Trigger Action
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const statusDiv = document.getElementById('status');
      btn.disabled = true;
      statusDiv.style.color = '#c9d1d9';
      statusDiv.innerHTML = 'Uploading image to incoming queue...';

      const file = document.getElementById('fileInput').files[0];
      const title = document.getElementById('title').value.trim();
      const pasuramKey = document.getElementById('pasuramKey').value.trim();
      const tags = document.getElementById('tags').value.trim();

      const reader = new FileReader();
      reader.onload = async () => {
        const base64Content = reader.result.split(',')[1];
        const cleanFileName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
        const filePath = `incoming/${Date.now()}_${cleanFileName}`;

        const commitMessage = JSON.stringify({
          type: "ASSET_UPLOAD",
          title: title,
          pasuramKey: pasuramKey,
          tags: tags.split(',').map(t => t.trim().toLowerCase()).filter(t => t)
        });

        try {
          const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filePath}`, {
            method: 'PUT',
            headers: {
              'Authorization': `token ${accessToken}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              message: commitMessage,
              content: base64Content
            })
          });

          if (!res.ok) {
            const errData = await res.json();
            throw new Error(errData.message || 'Upload failed');
          }

          statusDiv.style.color = '#3fb950';
          statusDiv.innerHTML = 'Uploaded to incoming/! GitHub Action will process the asset and update asset_database.json.';
          document.getElementById('uploadForm').reset();
        } catch (err) {
          statusDiv.style.color = '#f85149';
          statusDiv.innerHTML = `Error: ${err.message}`;
        } finally {
          btn.disabled = false;
        }
      };

      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
